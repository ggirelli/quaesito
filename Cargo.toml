[package]
name = "quaesito"
version = "0.7.0"
edition = "2024"
description = "Quizzes among friends: a self-hosted, live quiz web app"
repository = "https://github.com/ggirelli/quaesito"
license = "MIT"
publish = false

# The app is the root package; its domain logic and server live in member crates.
[workspace]
members = ["crates/core", "crates/playground", "crates/server"]
resolver = "3"

# Versions shared by several crates of the workspace.
[workspace.dependencies]
anyhow = "1"
dioxus = "0.7"
quaesito-core = { path = "crates/core", version = "0.0.0" }
quaesito-server = { path = "crates/server", version = "0.0.0" }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dependencies]
dioxus = { workspace = true, features = ["router"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
quaesito-core.workspace = true
serde.workspace = true

# Server only
anyhow = { workspace = true, optional = true }
quaesito-server = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# Browser only
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Location", "Storage", "Window"] }

[features]
default = ["web"]
# `dioxus/fullstack` by name: dx only builds the server when it sees it here.
web = ["dioxus/web", "dioxus/fullstack", "fullstack"]
server = ["dioxus/server", "fullstack", "dep:anyhow", "dep:quaesito-server", "dep:uuid"]
# The pages that talk to a server. Without it the crate only offers what runs in the browser alone:
# the screens' parts and the Playground (see crates/playground).
fullstack = ["dioxus/fullstack"]

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
