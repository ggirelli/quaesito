[package]
name = "quaesito"
version = "0.1.0"
edition = "2024"
description = "Quizzes among friends: a self-hosted, live quiz web app"
repository = "https://github.com/ggirelli/quaesito"
publish = false

[dependencies]
dioxus = { version = "0.7", features = ["router", "fullstack"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }

# Server only
anyhow = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"], optional = true }
unicode-normalization = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

# Browser only
[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Location", "Storage", "Window"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = ["web"]
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:anyhow",
    "dep:futures-util",
    "dep:image",
    "dep:serde_json",
    "dep:tokio",
    "dep:unicode-normalization",
    "dep:uuid",
    "dep:zip",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
