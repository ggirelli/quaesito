site_name: quaesito
site_description: Quizzes among friends. A self-hosted, live quiz for game nights.
site_url: https://ggirelli.github.io/quaesito/
repo_url: https://github.com/ggirelli/quaesito
repo_name: ggirelli/quaesito
edit_uri: edit/main/docs/
copyright: Free software under the MIT licence.

theme:
  name: material
  # Only the repository link, without facts fetched from GitHub (see overrides/partials).
  custom_dir: overrides
  logo: assets/icon-192.png
  favicon: assets/icon-192.png
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
  icon:
    repo: fontawesome/brands/github

# The guide ships with the app and must work offline, without third-party requests: the privacy
# plugin downloads the fonts (and any other external asset) at build time and serves them locally.
plugins:
  - search
  - privacy

exclude_docs: |
  requirements.txt
  media/demo-transcript.md

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - Building a quiz: building-a-quiz.md
      - Question types: question-types.md
      - Quiz settings: quiz-settings.md
      - Testing a quiz: testing.md
      - Running the game: running-the-game.md
      - After the game: after-the-game.md
      - Troubleshooting: troubleshooting.md
      - Configuration: configuration.md
  - Demo video: demo.md
  - Development: development.md
  - How it was made: how-it-was-made.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ggirelli/quaesito
      name: Source code
    - icon: simple/kofi
      link: https://ko-fi.com/ggirelli
      name: Support quaesito on Ko-fi
