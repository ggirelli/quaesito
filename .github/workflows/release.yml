name: Release

# Builds ready-to-run downloads: on a version tag (v1.2.3) they are attached to a GitHub release;
# run by hand, they are only kept as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  DIOXUS_CLI_VERSION: 0.7.10

jobs:
  package:
    name: package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 builds against an older glibc, so the server runs on more distributions.
          - { name: linux-x86_64, os: ubuntu-22.04, start: start.sh, archive: tar.gz }
          - { name: linux-arm64, os: ubuntu-22.04-arm, start: start.sh, archive: tar.gz }
          - { name: macos-arm64, os: macos-14, start: start.command, archive: tar.gz }
          # Intel Macs: built on Apple silicon, whose Rosetta 2 runs it for the smoke test.
          - { name: macos-x86_64, os: macos-14, target: x86_64-apple-darwin, start: start.command, archive: tar.gz }
          - { name: windows-x86_64, os: windows-latest, start: start.bat, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown${{ matrix.target && format(',{0}', matrix.target) || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      # The prebuilt dx needs a newer glibc than Ubuntu 22.04's: build it there instead.
      - if: runner.os == 'Linux'
        run: cargo install dioxus-cli --version "$DIOXUS_CLI_VERSION" --locked
      - if: runner.os != 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@${{ env.DIOXUS_CLI_VERSION }}
      # Naming a target for the server build replaces dx's own server arguments, so the features too.
      - name: Bundle
        run: dx bundle --platform web --release --out-dir dist ${{ matrix.target && format('@server --target {0} --no-default-features --features server', matrix.target) || '' }}
      # The server starts from another folder and answers: the app's page, its script and an admin
      # login.
      - name: Smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target='${{ matrix.target }}'
          file -b dist/server
          [ -z "$target" ] || file -b dist/server | grep -q "${target%%-*}"
          export IP=127.0.0.1 PORT=8090 QUAESITO_ADMIN_PASSWORD=smoke QUAESITO_DATA_DIR="$RUNNER_TEMP/data"
          (cd "$RUNNER_TEMP" && exec "$GITHUB_WORKSPACE/dist/server") &
          for _ in $(seq 60); do curl -fsS -o /dev/null "http://$IP:$PORT/" && break; sleep 1; done
          script=$(curl -fsS "http://$IP:$PORT/" | grep -o '/assets/quaesito-[^"]*\.js' | head -n 1)
          curl -fsS -o /dev/null "http://$IP:$PORT$script"
          curl -fsS -H 'Content-Type: application/json' -d '{"password":"smoke"}' \
            "http://$IP:$PORT/api/admin/login" | grep -Eq '^"[0-9a-f]{32}"$'
          kill %1
      - uses: astral-sh/setup-uv@v6
      # The user guide ships with the app and is served at /docs/, so it works without internet.
      - name: User guide
        run: uvx --with-requirements docs/requirements.txt mkdocs build --strict --site-dir guide
        env:
          NO_MKDOCS_2_WARNING: "true" # MkDocs is pinned below 2.0 in docs/requirements.txt
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="${GITHUB_SHA::7}"
          name="quaesito-$version-${{ matrix.name }}"
          mkdir -p "out/$name"
          cp -R dist/. "out/$name/"
          cp "packaging/${{ matrix.start }}" packaging/README.txt LICENSE "out/$name/"
          cp -R guide "out/$name/docs"
          # Files for running it as a service on a server; see the user guide's deployment page.
          [ "$RUNNER_OS" != Linux ] || cp -R packaging/deploy "out/$name/deploy"
          cd out
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            chmod +x "$name/${{ matrix.start }}"
            tar czf "$name.tar.gz" "$name"
          fi
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/quaesito-*.*
          if-no-files-found: error

  # The Windows download, unpacked and started from another folder, on x64 and on Windows on Arm
  # (under its x64 emulation): it answers the app's page, its script and an admin login.
  smoke-windows:
    name: smoke (windows-x86_64 on ${{ matrix.os }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: windows-x86_64
      - name: Smoke test
        shell: pwsh
        run: |
          "Running on $env:PROCESSOR_ARCHITECTURE"
          Expand-Archive -Path quaesito-*.zip -DestinationPath "$env:RUNNER_TEMP\app"
          $server = Get-ChildItem "$env:RUNNER_TEMP\app\*\server.exe"
          $env:IP = '127.0.0.1'; $env:PORT = '8090'; $env:QUAESITO_ADMIN_PASSWORD = 'smoke'
          $env:QUAESITO_DATA_DIR = "$env:RUNNER_TEMP\data"
          $proc = Start-Process $server.FullName -WorkingDirectory $env:RUNNER_TEMP -PassThru
          $base = 'http://127.0.0.1:8090'
          $page = $null
          foreach ($i in 1..60) {
            try { $page = Invoke-WebRequest "$base/" -UseBasicParsing; break } catch { Start-Sleep 1 }
          }
          if (-not $page) { throw 'The server did not answer' }
          $script = [regex]::Match($page.Content, '/assets/quaesito-[^"]*\.js').Value
          Invoke-WebRequest "$base$script" -UseBasicParsing | Out-Null
          $token = Invoke-RestMethod "$base/api/admin/login" -Method Post `
            -ContentType 'application/json' -Body '{"password":"smoke"}'
          if ($token -notmatch '^[0-9a-f]{32}$') { throw "Unexpected login answer: $token" }
          Stop-Process $proc

  release:
    if: github.ref_type == 'tag'
    needs: [package, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Downloads

          Unpack the archive for your system and double-click `start.bat` (Windows) or
          `start.command` (macOS), or run `./start.sh` (Linux). See `README.txt` inside.
          NOTES
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: out/*
